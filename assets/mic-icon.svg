<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="The Microphone">
  <!-- cream ground (safe zone kept inside the center 80% for maskable) -->
  <rect width="512" height="512" rx="96" fill="#EEE1C6"/>
  <!-- base plate -->
  <rect x="176" y="438" width="160" height="26" rx="13" fill="#2A2E25"/>
  <!-- stem -->
  <rect x="244" y="330" width="24" height="112" fill="#2A2E25"/>
  <!-- capsule body -->
  <rect x="184" y="72" width="144" height="272" rx="72" fill="#00471B" stroke="#2A2E25" stroke-width="10"/>
  <!-- grille slots -->
  <g fill="#EEE1C6">
    <rect x="214" y="120" width="84" height="16" rx="8"/>
    <rect x="214" y="158" width="84" height="16" rx="8"/>
    <rect x="214" y="196" width="84" height="16" rx="8"/>
  </g>
  <!-- amber sound band -->
  <rect x="214" y="234" width="84" height="16" rx="8" fill="#C79A3C"/>
  <!-- yoke ring -->
  <path d="M148 250 a108 108 0 0 0 216 0" fill="none" stroke="#2A2E25" stroke-width="18" stroke-linecap="round"/>
</svg>
